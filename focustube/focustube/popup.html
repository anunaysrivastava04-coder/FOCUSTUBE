<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FocusTube</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="shell">
    <header class="head">
      <svg class="logo" viewBox="0 0 128 128" aria-hidden="true">
        <defs>
          <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ff3d57"/>
            <stop offset="0.55" stop-color="#8b5cf6"/>
            <stop offset="1" stop-color="#3b82f6"/>
          </linearGradient>
        </defs>
        <rect width="128" height="128" rx="30" fill="url(#lg)"/>
        <path d="M44 34 L44 90 L90 62 Z" fill="#fff" stroke="#fff" stroke-width="8" stroke-linejoin="round"/>
        <circle cx="94" cy="94" r="27" fill="#14151a" stroke="#fff" stroke-width="5"/>
        <rect x="84" y="82" width="7" height="24" rx="2" fill="#fff"/>
        <rect x="97" y="82" width="7" height="24" rx="2" fill="#fff"/>
      </svg>
      <div>
        <h1>FocusTube</h1>
        <p class="sub">Stay focused. Videos handle themselves.</p>
      </div>
    </header>

    <section class="card main-toggle">
      <div class="row">
        <div class="row-text">
          <span class="row-title" id="lbl-enabled">Auto Pause</span>
          <span class="row-desc" id="enabled-state">On</span>
        </div>
        <button id="sw-enabled" class="switch" role="switch" aria-checked="true" aria-labelledby="lbl-enabled"><span></span></button>
      </div>
    </section>

    <section class="card status" aria-live="polite">
      <span id="dot" class="dot waiting" aria-hidden="true"></span>
      <div>
        <div id="status-title" class="status-title">Waiting for YouTube</div>
        <div id="status-detail" class="status-detail">Open a YouTube tab to get started.</div>
      </div>
    </section>

    <section class="card">
      <div class="row-title" id="lbl-delay">Pause delay</div>
      <div class="seg" role="radiogroup" aria-labelledby="lbl-delay" id="delay">
        <button role="radio" aria-checked="false" data-delay="0" tabindex="-1">Instant</button>
        <button role="radio" aria-checked="false" data-delay="1000" tabindex="-1">1s</button>
        <button role="radio" aria-checked="false" data-delay="3000" tabindex="-1">3s</button>
        <button role="radio" aria-checked="false" data-delay="5000" tabindex="-1">5s</button>
      </div>
    </section>

    <section class="card settings">
      <div class="row">
        <div class="row-text">
          <span class="row-title" id="lbl-resume">Resume when I return</span>
          <span class="row-desc">Only videos FocusTube paused</span>
        </div>
        <button id="sw-autoResume" class="switch" role="switch" aria-checked="true" aria-labelledby="lbl-resume"><span></span></button>
      </div>
      <div class="row">
        <div class="row-text">
          <span class="row-title" id="lbl-toasts">On-page notices</span>
          <span class="row-desc">Small message on YouTube</span>
        </div>
        <button id="sw-toasts" class="switch" role="switch" aria-checked="true" aria-labelledby="lbl-toasts"><span></span></button>
      </div>
    </section>

    <footer class="foot">
      <span class="credit">Developed by <strong>Anunay Srivastava</strong></span>
      <nav class="social" aria-label="Developer links">
        <a href="https://github.com/anunaysrivastava04-coder" target="_blank" rel="noopener noreferrer" aria-label="GitHub profile" title="GitHub" class="gh">

        </a>
        <a href="https://www.instagram.com/anunay_srivastava108" target="_blank" rel="noopener noreferrer" aria-label="Instagram profile" title="Instagram" class="ig">

  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="popup.js"></script>
</body>
</html>
